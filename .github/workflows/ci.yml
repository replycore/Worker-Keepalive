name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # worker.js 是构建产物并提交到仓库：改了源码必须重新打包，否则 CI 失败
      - name: 确认 worker.js 已重新打包
        run: git diff --exit-code -- worker.js
